name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Only build these (comma-separated: windows-x64, windows-arm64, android); empty builds all"
        type: string
        default: ""

jobs:
  # Fork: the scheduled build is skipped when nothing was committed since the last
  # successful nightly build; a manual run always builds.
  check-for-changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh run list --workflow flutter-nightly.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "No new commits since the last nightly build ($last); skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  run-flutter-nightly-build:
    needs: check-for-changes
    if: ${{ needs.check-for-changes.outputs.changed == 'true' }}
    # Uploads to the release; a fork's default token is read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      platforms: ${{ inputs.platforms || '' }}
