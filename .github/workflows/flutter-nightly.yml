name: Flutter Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Only build these (comma-separated: windows-x64, windows-arm64, android); empty builds all"
        type: string
        default: ""

jobs:
  run-flutter-nightly-build:
    # Uploads to the release; a fork's default token is read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      platforms: ${{ inputs.platforms || '' }}
